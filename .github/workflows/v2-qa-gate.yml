name: V2 QA Gate

on:
  pull_request:
    branches:
      - codex/v2-amazon-contracts

permissions:
  contents: read

concurrency:
  group: v2-qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application-gate:
    name: TypeScript, release tests, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: cargomesh
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.20.0
          cache: pnpm
          cache-dependency-path: cargomesh/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm typecheck

      - name: Run release test chain
        run: pnpm test:release

      - name: Build production bundle
        run: pnpm build

  pgtap-gate:
    name: Local Supabase pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.20.0
          package-manager-cache: false

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3.0.0
        with:
          version: 2.117.0

      - name: Start local Supabase
        run: supabase db start

      - name: Seed and verify local V2 QA scenario
        run: |
          docker exec -i supabase_db_cargomesh psql -X -v local_only=1 -U postgres -d postgres < supabase/scenarios/v2-road-baseline/seed.sql
          docker exec -i supabase_db_cargomesh psql -X -U postgres -d postgres < supabase/scenarios/v2-road-baseline/verify.sql

      - name: Run pgTAP suite
        run: supabase test db
